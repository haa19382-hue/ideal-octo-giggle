name: AF_ALG Security Audit

on:
  push:
  workflow_dispatch:

jobs:

  # ══════════════════════════════════════════════════════════════
  # JOB 1 — تحقق من sg_next() سلوكها مع end marker
  # السؤال: هل ترجع NULL أم تكمل؟
  # ══════════════════════════════════════════════════════════════
  check-sg-next:
    name: "① sg_next() behavior with end marker"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch scatterlist header
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/include/linux/scatterlist.h \
            -o scatterlist.h

      - name: Extract sg_next definition
        run: |
          echo "=== sg_next() definition ==="
          grep -A 15 "static inline struct scatterlist \*sg_next" scatterlist.h

          echo ""
          echo "=== sg_is_last() definition ==="
          grep -A 5 "sg_is_last" scatterlist.h | head -20

          echo ""
          echo "=== SG_END bit value ==="
          grep -E "SG_END|SG_CHAIN|page_link" scatterlist.h | head -20

      - name: Confirm NULL return path
        run: |
          echo "=== Does sg_next return NULL when last? ==="
          if grep -q "return NULL" scatterlist.h; then
            echo "CONFIRMED: sg_next() returns NULL on last entry"
          else
            echo "NOT FOUND in header — check scatterlist.c"
          fi

      - name: Fetch scatterlist.c for confirmation
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/lib/scatterlist.c \
            -o scatterlist.c
          echo "=== sg_next in .c ==="
          grep -A 10 "sg_next" scatterlist.c | head -30


  # ══════════════════════════════════════════════════════════════
  # JOB 2 — تحقق من memcpy_sglist: هل تفحص حدود dst؟
  # السؤال: هل تتوقف عند نهاية dst أم تكمل؟
  # ══════════════════════════════════════════════════════════════
  check-memcpy-sglist:
    name: "② memcpy_sglist() dst bounds check"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch scatterwalk.c
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/scatterwalk.c \
            -o scatterwalk.c

      - name: Extract memcpy_sglist full body
        run: |
          echo "=== memcpy_sglist() full implementation ==="
          # استخراج الدالة كاملة
          awk '/^void memcpy_sglist/,/^}/' scatterwalk.c

      - name: Check for dst bounds validation
        run: |
          echo ""
          echo "=== Does memcpy_sglist validate dst capacity? ==="

          # هل يوجد أي فحص لحجم dst قبل الكتابة؟
          if awk '/^void memcpy_sglist/,/^}/' scatterwalk.c | \
             grep -qE "(dst.*length|dst.*size|WARN|BUG_ON)"; then
            echo "FOUND: dst validation exists"
          else
            echo "NOT FOUND: No dst bounds check — writes blindly to dst"
          fi

          echo ""
          echo "=== sg_next(dst) call — where is it? ==="
          awk '/^void memcpy_sglist/,/^}/' scatterwalk.c | grep -n "sg_next\|dst ="


  # ══════════════════════════════════════════════════════════════
  # JOB 3 — تحقق من aead_assoclen vs usedpages
  # السؤال: هل يوجد فحص usedpages >= aead_assoclen قبل memcpy_sglist؟
  # ══════════════════════════════════════════════════════════════
  check-assoclen-guard:
    name: "③ aead_assoclen guard before memcpy_sglist"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch algif_aead.c
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/algif_aead.c \
            -o algif_aead.c

      - name: Extract _aead_recvmsg full body
        run: |
          echo "=== _aead_recvmsg() — full function ==="
          awk '/^static int _aead_recvmsg/,/^}/' algif_aead.c

      - name: Check for assoclen vs usedpages guard
        run: |
          echo ""
          echo "=== Is there a check: usedpages >= aead_assoclen? ==="

          FUNC=$(awk '/^static int _aead_recvmsg/,/^}/' algif_aead.c)

          # هل يوجد فحص صريح؟
          if echo "$FUNC" | grep -qE "usedpages.*assoclen|assoclen.*usedpages"; then
            echo "GUARD EXISTS: usedpages vs aead_assoclen check found"
            echo "$FUNC" | grep -n "assoclen"
          else
            echo "NO GUARD: usedpages vs aead_assoclen — check MISSING"
          fi

          echo ""
          echo "=== Line order: usedpages calculation vs memcpy_sglist ==="
          grep -n "usedpages\|memcpy_sglist\|aead_assoclen" algif_aead.c | head -30

      - name: Trace the exact data flow
        run: |
          echo ""
          echo "=== outlen shrink path — does assoclen shrink too? ==="
          awk '/if \(usedpages < outlen\)/,/memcpy_sglist/' algif_aead.c | head -20


  # ══════════════════════════════════════════════════════════════
  # JOB 4 — تحقق من first_rsgl: هل sg_mark_end مضبوطة؟
  # السؤال: هل الـ end marker موجودة فعلاً على آخر entry؟
  # ══════════════════════════════════════════════════════════════
  check-rsgl-end-marker:
    name: "④ first_rsgl sg_mark_end presence"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch af_alg.c
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/af_alg.c \
            -o af_alg.c

      - name: Extract af_alg_get_rsgl
        run: |
          echo "=== af_alg_get_rsgl() — full function ==="
          awk '/^int af_alg_get_rsgl/,/^}/' af_alg.c

      - name: Confirm sg_mark_end is set
        run: |
          echo ""
          echo "=== Is sg_mark_end called on first_rsgl? ==="
          FUNC=$(awk '/^int af_alg_get_rsgl/,/^}/' af_alg.c)

          if echo "$FUNC" | grep -q "sg_mark_end"; then
            echo "CONFIRMED: sg_mark_end IS set on rsgl entries"
            echo "$FUNC" | grep -n "sg_mark_end"
          else
            echo "NOT FOUND: sg_mark_end not called — heap corruption path"
          fi

          echo ""
          echo "=== What size is first_rsgl initialized with? ==="
          echo "$FUNC" | grep -n "sg_init_table\|ALG_MAX_PAGES\|nents"


  # ══════════════════════════════════════════════════════════════
  # JOB 5 — تحقق من ctx->inflight وحماية AIO في skcipher
  # السؤال: هل lock_sock يحمي ctx->inflight في كل مسار؟
  # ══════════════════════════════════════════════════════════════
  check-inflight-locking:
    name: "⑤ ctx->inflight locking in skcipher AIO"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch algif_skcipher.c
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/algif_skcipher.c \
            -o algif_skcipher.c

      - name: Fetch af_alg.c for alloc_areq
        run: |
          curl -sL \
            https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/af_alg.c \
            -o af_alg.c

      - name: Check inflight set/clear paths
        run: |
          echo "=== All inflight references in af_alg.c ==="
          grep -n "inflight" af_alg.c

          echo ""
          echo "=== All inflight references in algif_skcipher.c ==="
          grep -n "inflight" algif_skcipher.c

      - name: Check lock_sock coverage
        run: |
          echo ""
          echo "=== lock_sock calls in skcipher_recvmsg ==="
          awk '/^static int skcipher_recvmsg/,/^}/' algif_skcipher.c | \
            grep -n "lock_sock\|release_sock\|inflight\|sock_hold\|sock_put"

          echo ""
          echo "=== algif_skcipher_done — locking context? ==="
          awk '/^static void algif_skcipher_done/,/^}/' algif_skcipher.c

          echo ""
          echo "=== algif_skcipher_export — locking context? ==="
          awk '/^static int algif_skcipher_export/,/^}/' algif_skcipher.c

      - name: Check sock_destruct locking
        run: |
          echo ""
          echo "=== skcipher_sock_destruct ==="
          awk '/^static void skcipher_sock_destruct/,/^}/' algif_skcipher.c


  # ══════════════════════════════════════════════════════════════
  # JOB 6 — تجميع النتائج وإصدار الحكم النهائي
  # ══════════════════════════════════════════════════════════════
  final-verdict:
    name: "⑥ Final Security Verdict"
    runs-on: ubuntu-latest
    needs:
      - check-sg-next
      - check-memcpy-sglist
      - check-assoclen-guard
      - check-rsgl-end-marker
      - check-inflight-locking
    steps:
      - name: Fetch all files needed
        run: |
          curl -sL https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/algif_aead.c     -o algif_aead.c
          curl -sL https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/algif_skcipher.c -o algif_skcipher.c
          curl -sL https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/af_alg.c         -o af_alg.c
          curl -sL https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/crypto/scatterwalk.c    -o scatterwalk.c
          curl -sL https://raw.githubusercontent.com/torvalds/linux/refs/heads/master/include/linux/scatterlist.h -o scatterlist.h

      - name: Run consolidated checks
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           AF_ALG SECURITY AUDIT — FINAL REPORT              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"

          # ── CHECK 1: sg_next NULL return ──
          echo ""
          echo "CHECK 1: sg_next() returns NULL on last entry"
          if grep -q "return NULL" scatterlist.h; then
            echo "  RESULT: ✅ CONFIRMED — sg_next returns NULL"
          else
            # قد يكون في .c
            echo "  RESULT: ⚠️  Check scatterlist.c manually"
          fi

          # ── CHECK 2: memcpy_sglist has no dst bounds check ──
          echo ""
          echo "CHECK 2: memcpy_sglist dst bounds validation"
          MEMCPY=$(awk '/^void memcpy_sglist/,/^}/' scatterwalk.c)
          if echo "$MEMCPY" | grep -qE "WARN|BUG_ON|dst.*capacity|dst.*size"; then
            echo "  RESULT: ✅ SAFE — dst validation exists"
          else
            echo "  RESULT: 🔴 UNSAFE — no dst bounds check in memcpy_sglist"
          fi

          # ── CHECK 3: missing guard aead_assoclen vs usedpages ──
          echo ""
          echo "CHECK 3: Guard usedpages >= aead_assoclen before memcpy_sglist"
          RECVMSG=$(awk '/^static int _aead_recvmsg/,/^}/' algif_aead.c)
          if echo "$RECVMSG" | grep -qE "usedpages.*assoclen|assoclen.*usedpages"; then
            echo "  RESULT: ✅ GUARD EXISTS"
          else
            echo "  RESULT: 🔴 GUARD MISSING — potential null deref / oob write"
          fi

          # ── CHECK 4: sg_mark_end on rsgl ──
          echo ""
          echo "CHECK 4: sg_mark_end set on first_rsgl"
          GETRSGL=$(awk '/^int af_alg_get_rsgl/,/^}/' af_alg.c)
          if echo "$GETRSGL" | grep -q "sg_mark_end"; then
            echo "  RESULT: ✅ sg_mark_end IS set → sg_next returns NULL → DoS path"
          else
            echo "  RESULT: 🔴 sg_mark_end NOT set → heap corruption path"
          fi

          # ── CHECK 5: inflight locking ──
          echo ""
          echo "CHECK 5: ctx->inflight protected by lock_sock in all paths"
          DONE=$(awk '/^static void algif_skcipher_done/,/^}/' algif_skcipher.c)
          EXPORT=$(awk '/^static int algif_skcipher_export/,/^}/' algif_skcipher.c)

          if echo "$DONE$EXPORT" | grep -q "lock_sock"; then
            echo "  RESULT: ✅ lock_sock present in AIO callback"
          else
            echo "  RESULT: ⚠️  No lock_sock in done/export — verify sock_hold suffices"
            echo "          (sock_hold prevents destruct but not concurrent state access)"
          fi

          echo ""
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  SUMMARY                                                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  If CHECK 2=UNSAFE and CHECK 3=MISSING and CHECK 4=set:     ║"
          echo "║  → NULL deref in memcpy_sglist when aead_assoclen > RX buf  ║"
          echo "║  → Unprivileged user can trigger kernel panic (DoS)          ║"
          echo "║                                                              ║"
          echo "║  Fix needed in _aead_recvmsg():                             ║"
          echo "║    if (usedpages < ctx->aead_assoclen) {                    ║"
          echo "║        err = -EINVAL; goto free;                            ║"
          echo "║    }                                                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
